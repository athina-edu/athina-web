services:
  athina-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: athinaweb:local
    command: bash -c "python manage.py collectstatic --noinput && gunicorn --bind :8000 athinaweb.wsgi:application"
    volumes:
      - ./static_files/:/code/static_files/
    ports:
      - "8000:8000"
